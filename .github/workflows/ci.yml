name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install --quiet pytest fastapi httpx
      - name: Run test suite
        run: python -m pytest -q
      - name: Package validation
        run: python skills/adaptive-learn/scripts/validate_package.py
      - name: Wheel install smoke
        run: |
          python -m pip install --quiet .
          python skills/adaptive-learn/scripts/smoke_installed.py
  browser-e2e:
    # Real built UI + real local bridge on the synthetic TEST FIXTURE course.
    # Playwright and the frontend's npm packages are CI tooling, not package dependencies.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test tooling
        run: |
          python -m pip install --quiet playwright==1.61.0
          python -m playwright install --with-deps chromium
      - name: Install the course app build dependencies (CI tooling, from the template package.json)
        run: |
          mkdir -p "$RUNNER_TEMP/frontend-deps"
          cp skills/adaptive-learn/templates/react/package.json "$RUNNER_TEMP/frontend-deps/"
          npm install --prefix "$RUNNER_TEMP/frontend-deps" --no-audit --no-fund
      - name: Browser E2E — course (assertion-bearing; exits non-zero on any failed check)
        run: python tests/e2e/course_ui_e2e.py --out e2e-artifacts --node-modules "$RUNNER_TEMP/frontend-deps/node_modules"
      - name: Browser E2E — learner journey
        if: always()
        run: python tests/e2e/course_journey_e2e.py --out e2e-journey --node-modules "$RUNNER_TEMP/frontend-deps/node_modules"
      - name: Upload assertion logs, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-e2e
          path: |
            e2e-artifacts/e2e-log.json
            e2e-artifacts/vite-build.log
            e2e-artifacts/trace.zip
            e2e-artifacts/screenshots/
            e2e-journey/*.json
            e2e-journey/*.zip
            e2e-journey/screenshots/
          retention-days: 14
