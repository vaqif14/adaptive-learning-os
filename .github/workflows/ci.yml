name: ci
on:
  push:
  pull_request:
# Least privilege: no token scopes by default; each job asks only for what it reads.
permissions: {}
jobs:
  test:
    runs-on: ${{ matrix.os }}
    # A hung test must not hold a runner for the 6h default (full suite is ~15 min per cell).
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      # Actions are pinned to immutable commit SHAs (tags are mutable); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4 (resolved 2026-10-13)
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (resolved 2026-10-13)
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies (exact versions)
        run: python -m pip install --quiet pytest==9.1.1 fastapi==0.136.3 httpx==0.28.1
      - name: Run test suite
        run: python -m pytest -q
      - name: Package validation
        run: python skills/adaptive-learn/scripts/validate_package.py
      - name: Wheel install smoke
        run: |
          python -m pip install --quiet .
          python skills/adaptive-learn/scripts/smoke_installed.py
  browser-e2e:
    # Real built UI + real local bridge on the synthetic TEST FIXTURE course.
    # Playwright and the frontend's npm packages are CI tooling, not package dependencies.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4 (resolved 2026-10-13)
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (resolved 2026-10-13)
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4 (resolved 2026-10-13)
        with:
          node-version: "22"
      - name: Install browser test tooling (exact version)
        run: |
          python -m pip install --quiet playwright==1.61.0
          python -m playwright install --with-deps chromium
      - name: Install the course app build dependencies from the committed lockfile (no lifecycle scripts)
        run: |
          mkdir -p "$RUNNER_TEMP/frontend-deps"
          cp skills/adaptive-learn/templates/react/package.json skills/adaptive-learn/templates/react/package-lock.json "$RUNNER_TEMP/frontend-deps/"
          npm ci --prefix "$RUNNER_TEMP/frontend-deps" --ignore-scripts --no-audit --no-fund
      - name: Browser E2E — course (assertion-bearing; exits non-zero on any failed check)
        run: python tests/e2e/course_ui_e2e.py --out e2e-artifacts --node-modules "$RUNNER_TEMP/frontend-deps/node_modules"
      - name: Browser E2E — learner journey
        if: always()
        run: python tests/e2e/course_journey_e2e.py --out e2e-journey --node-modules "$RUNNER_TEMP/frontend-deps/node_modules"
      - name: Browser E2E — Course Studio owner UI and learner practice-first UI
        if: always()
        run: python tests/e2e/studio_e2e.py --out e2e-studio --node-modules "$RUNNER_TEMP/frontend-deps/node_modules"
      - name: Upload assertion logs, screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4 (resolved 2026-10-13)
        with:
          name: course-e2e
          path: |
            e2e-artifacts/e2e-log.json
            e2e-artifacts/vite-build.log
            e2e-artifacts/trace.zip
            e2e-artifacts/screenshots/
            e2e-journey/*.json
            e2e-journey/*.zip
            e2e-journey/screenshots/
            e2e-studio/e2e-log.json
            e2e-studio/vite-build.log
            e2e-studio/trace.zip
            e2e-studio/screenshots/
          retention-days: 14
